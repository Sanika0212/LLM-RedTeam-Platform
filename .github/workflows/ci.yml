name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: ruff check backend/ --ignore=E501,E402,F401
      - name: Lint redteam-engine
        run: ruff check redteam-engine/ --ignore=E501,E402,F401

  test-backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_ci.db
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      OPENAI_API_KEY: "sk-test"
      ANTHROPIC_API_KEY: "sk-ant-test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn[standard] python-multipart \
            sqlalchemy alembic \
            python-jose[cryptography] passlib[bcrypt] \
            python-dotenv pydantic \
            httpx \
            pytest pytest-cov pytest-asyncio
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --cov=. --cov-report=term --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine CI dependencies
        working-directory: redteam-engine
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-cov \
            numpy pydantic python-dotenv
      - name: Run engine tests
        working-directory: redteam-engine
        run: |
          pytest tests/ -v --cov=. --cov-report=term

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  build-frontend:
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
