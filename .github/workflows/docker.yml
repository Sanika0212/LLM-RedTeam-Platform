name: Docker Build & Push

# Run manually from GitHub Actions tab when you want to build and push images.
# Not triggered on push to avoid Docker Hub rate-limit failures on shared runners.
on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to GHCR after building?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and optionally push) backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/backend/Dockerfile
          push: ${{ github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and optionally push) frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/frontend/Dockerfile
          push: ${{ github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-frontend:${{ github.sha }}

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and optionally push) worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/worker/Dockerfile
          push: ${{ github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-worker:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/llm-redteam-worker:${{ github.sha }}
